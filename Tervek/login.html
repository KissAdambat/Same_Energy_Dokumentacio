<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SAMEENERGY</title>
    <link rel="stylesheet" href="login.css">
</head>

<body class="login-page">

    <div class="login-box">
        <div class="login-logo">
            <h1>SAME<br><span>ENERGY</span></h1>
            <p>AUTHENTICATED STYLE</p>
        </div>

        <div class="line"></div>

        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your SAMEENERGY account</p>

        <form id="loginForm">
            <label for="email">EMAIL ADDRESS</label>
            <input type="email" id="email" required>

            <label for="password">PASSWORD</label>
            <input type="password" id="password" required>

            <button type="submit" class="login-btn">
                SIGN IN
            </button>
        </form>

        <p id="message"></p>

        <a href="fooldal.html" class="bottom-link">
            BACK TO WEBSITE
        </a>
    </div>

    <script src="script.js"></script>
</body>

</html>
